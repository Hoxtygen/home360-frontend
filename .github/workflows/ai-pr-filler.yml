name: AI PR Filler

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  fill-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install axios

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1

          git diff origin/${{ github.base_ref }}...HEAD --stat \
            -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)yarn.lock' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)node_modules' \
            ':(exclude).next' \
            ':(exclude)dist' \
            ':(exclude)build' \
            ':(exclude)*.svg' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.ico' \
            ':(exclude)public/fonts' \
            > pr.stat

          git diff -U1 origin/${{ github.base_ref }}...HEAD \
            -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)yarn.lock' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)node_modules' \
            ':(exclude).next' \
            ':(exclude)dist' \
            ':(exclude)build' \
            ':(exclude)*.svg' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.ico' \
            ':(exclude)public/fonts' \
            > pr.diff

      - name: Skip AI if only docs / config / formatting changed
        id: skip-check
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          # If there are NO files outside the allowed non-code patterns → skip
          if grep -Ev '(^\.github/|\.md$|\.txt$|\.ya?ml$|\.json$|\.env|\.prettierrc|\.editorconfig|\.eslintrc)' changed_files.txt >/dev/null; then
            echo "Code changes detected – AI will run."
            echo "SKIP_AI=false" >> $GITHUB_ENV
          else
            echo "Only docs / config / formatting files changed – skipping AI."
            echo "SKIP_AI=true" >> $GITHUB_ENV
          fi

      - name: Skip if PR already edited by humans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} \
            --json body -q .body > current_body.txt

          # Normalize line endings
          tr -d '\r' < current_body.txt > current_body.norm.txt
          tr -d '\r' < .github/pull_request_template.md > template.norm.txt

          if ! diff -q current_body.norm.txt template.norm.txt >/dev/null; then
            echo "PR body was already edited by a human. Skipping AI update."
            exit 0
          fi

      - name: Generate PR Body
        id: generate-body
        if: env.SKIP_AI != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          COMMITS=$(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"- %s")

          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "PR_TITLE<<EOF" >> $GITHUB_ENV
          echo "${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          node scripts/ai-pr-filler.mjs pr.diff pr.stat > pr_body.txt

      - name: Post PR description suggestion
        if: env.SKIP_AI != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s pr_body.txt ]; then
            echo "Generated PR body is empty, skipping comment."
            exit 0
          fi

          {
            echo "🤖 **Suggested PR description**"
            echo ""
            echo "_You can copy and paste this into the PR description if it looks good._"
            echo ""
            echo "<details>"
            echo "<summary>Show suggested description</summary>"
            echo ""
            echo '```markdown'
            cat pr_body.txt
            echo '```'
            echo ""
            echo "</details>"
          } > pr_comment.txt

          gh pr comment ${{ github.event.pull_request.number }} --body-file pr_comment.txt
